<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480' viewBox='0 0 480 480'>
  <rect width='480' height='480' rx='16' fill='#1A1A1A'/>
  <rect x='0' y='0' width='480' height='480' rx='16' fill='url(#bg)'/>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#1A1A1A'/>
      <stop offset='1' stop-color='#0A0A0A'/>
    </linearGradient>
    <linearGradient id='lineStroke' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#EF4444'/>
      <stop offset='1' stop-color='#7F1D1D'/>
    </linearGradient>
  </defs>
  <!-- grid lines -->
  <g stroke='#374151' stroke-dasharray='4 6' opacity='0.4'>
    <line x1='40' y1='100' x2='440' y2='100'/>
    <line x1='40' y1='200' x2='440' y2='200'/>
    <line x1='40' y1='300' x2='440' y2='300'/>
    <line x1='40' y1='400' x2='440' y2='400'/>
  </g>
  <!-- declining area -->
  <path d='M40 80 C120 120 200 180 280 260 C320 300 380 340 440 420 L440 460 L40 460 Z' fill='#7F1D1D' opacity='0.35'/>
  <path d='M40 80 C120 120 200 180 280 260 C320 300 380 340 440 420' fill='none' stroke='url(#lineStroke)' stroke-width='4' stroke-linecap='round'/>
  <!-- down arrow -->
  <path d='M420 320 L440 420 L340 402' fill='none' stroke='#EF4444' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/>
  <circle cx='40' cy='80' r='6' fill='#10B981'/>
  <!-- labels -->
  <text x='48' y='70' fill='#6B7280' font-family='JetBrains Mono, monospace' font-size='14'>Ventas antes</text>
  <text x='48' y='430' fill='#EF4444' font-family='JetBrains Mono, monospace' font-size='16' font-weight='bold'>✕ Sin ventas</text>
  <text x='100' y='250' fill='#6B7280' font-family='JetBrains Mono, monospace' font-size='13'>Clientes se van →</text>
</svg>
